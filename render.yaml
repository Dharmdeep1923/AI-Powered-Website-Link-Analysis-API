services:
  - type: web
    name: ai-link-analysis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: GEMINI_API_KEY
        sync: false
      - key: ANALYSIS_API_KEY
        generateValue: true
